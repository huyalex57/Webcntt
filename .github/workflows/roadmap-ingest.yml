name: Roadmap Ingest (Pinned Commit)

on:
  workflow_dispatch:
    inputs:
      parse_only:
        description: 'Only parse and verify license/schema without DB load'
        required: false
        default: 'true'
        type: boolean

jobs:
  ingest-roadmaps:
    name: Verify License & Parse Pinned Roadmap Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pinned Roadmap Ingest (Parse + License & Schema Gate)
        run: npx tsx scripts/roadmap-ingest/ingest.ts --parse-only
